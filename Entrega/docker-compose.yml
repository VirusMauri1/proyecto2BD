version: '3.9'
services:
  db:
    image: postgres:16-alpine
    container_name: tienda_db
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./pgadmin/PY_DDL.sql:/docker-entrypoint-initdb.d/01_ddl.sql
      - ./db/view.sql:/docker-entrypoint-initdb.d/02_view.sql
      - ./pgadmin/inserts.sql:/docker-entrypoint-initdb.d/03_inserts.sql
      - ./db/roles_procedures.sql:/docker-entrypoint-initdb.d/04_roles.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    container_name: tienda_backend
    environment:
      DB_HOST:        db
      DB_PORT:        5432
      DB_NAME:        ${DB_NAME}
      DB_USER:        ${DB_USER}
      DB_PASSWORD:    ${DB_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      PORT:           3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: tienda_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db_data: